services:
  postgres:
    image: postgres:17-alpine
    container_name: chainbooks-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chainbooks
    ports:
      - "5432:5432"
    volumes:
      - chainbooks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chainbooks"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chainbooks_pgdata:
    driver: local
